version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: news-summarizer-db
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_summarizer
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_summarizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  cron-job:
    build:
      context: ./cron-job
    container_name: news-summarizer-cron
    profiles:
      - jobs
    environment:
      BACKEND_BASE_URL: ${CRON_BACKEND_BASE_URL:-http://backend:8000}
      API_AUTH_KEY: ${API_AUTH_KEY:-change-me-local-api-auth-key}
      RUN_ONCE: ${CRON_RUN_ONCE:-false}
      ECONOMIC_REFRESH_EVERY: ${CRON_ECONOMIC_REFRESH_EVERY:-1}
      ECONOMIC_REFRESH_UNIT: ${CRON_ECONOMIC_REFRESH_UNIT:-hours}
      SUMMARY_REFRESH_EVERY: ${CRON_SUMMARY_REFRESH_EVERY:-3}
      SUMMARY_REFRESH_UNIT: ${CRON_SUMMARY_REFRESH_UNIT:-hours}
      ECONOMIC_REQUEST_TIMEOUT_SECONDS: ${CRON_ECONOMIC_REQUEST_TIMEOUT_SECONDS:-60}
      SUMMARY_REQUEST_TIMEOUT_SECONDS: ${CRON_SUMMARY_REQUEST_TIMEOUT_SECONDS:-180}
      DELIVERY_REQUEST_TIMEOUT_SECONDS: ${CRON_DELIVERY_REQUEST_TIMEOUT_SECONDS:-180}
      REQUEST_TIMEOUT_SECONDS: ${CRON_REQUEST_TIMEOUT_SECONDS:-180}
      REQUEST_RETRIES: ${CRON_REQUEST_RETRIES:-2}
      SUMMARY_TRIGGER_PATH: ${CRON_SUMMARY_TRIGGER_PATH:-/trigger/summary}
      SUMMARY_TIME_OF_DAY: ${CRON_SUMMARY_TIME_OF_DAY:-manual}
      DELIVERY_TRIGGER_PATH: ${CRON_DELIVERY_TRIGGER_PATH:-/trigger/delivery}
      SCHEDULE_SUMMARY_MORNING: ${SCHEDULE_SUMMARY_MORNING:-09:00}
      SCHEDULE_SUMMARY_AFTERNOON: ${SCHEDULE_SUMMARY_AFTERNOON:-16:00}
      SCHEDULE_SUMMARY_NIGHT: ${SCHEDULE_SUMMARY_NIGHT:-20:00}
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-America/La_Paz}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
