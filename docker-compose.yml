version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: news-summarizer-db
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_summarizer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_summarizer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
